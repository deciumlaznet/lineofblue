<style>/* Layout: operations console. Fixed left rail of workspaces, a top bar for who you are acting as and the scenario clock,
   and a main canvas where each workspace is a summary strip followed by working panels. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --surface-2: #e9edf3; --line: #d3dae4;
  --ink: #142033; --ink-2: #4a5a70; --ink-3: #6f7d91;
  --accent: #1b4fa0; --accent-ink: #ffffff; --accent-soft: #dfe8f7;
  --crit: #b3261e; --crit-soft: #fbe4e2; --warn: #9a5b00; --warn-soft: #fcefd6;
  --ok: #1e6b3a; --ok-soft: #dcf1e3; --info: #3d5a80; --info-soft: #e3eaf3;
  --banner: #fff4c2; --banner-ink: #5c4500;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1622; --surface: #172131; --surface-2: #1f2b3e; --line: #2c3a50;
  --ink: #e6ecf5; --ink-2: #aab7ca; --ink-3: #8593a8;
  --accent: #7fa8ee; --accent-ink: #0b1424; --accent-soft: #22355a;
  --crit: #ff8a80; --crit-soft: #3d1f1f; --warn: #f0b562; --warn-soft: #3a2c14; --ok: #7fd49a; --ok-soft: #173323; --info: #9fb8da; --info-soft: #1f2d42;
  --banner: #3a3214; --banner-ink: #f3dc8a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1622; --surface: #172131; --surface-2: #1f2b3e; --line: #2c3a50;
  --ink: #e6ecf5; --ink-2: #aab7ca; --ink-3: #8593a8;
  --accent: #7fa8ee; --accent-ink: #0b1424; --accent-soft: #22355a;
  --crit: #ff8a80; --crit-soft: #3d1f1f; --warn: #f0b562; --warn-soft: #3a2c14; --ok: #7fd49a; --ok-soft: #173323; --info: #9fb8da; --info-soft: #1f2d42;
  --banner: #3a3214; --banner-ink: #f3dc8a; color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font-body); }
h1, h2, h3 { font-family: var(--font-head); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: 1.6rem; font-weight: 600; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 0.85rem; }
.eyebrow { font: 600 0.72rem/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

.banner { background: var(--banner); color: var(--banner-ink); font-size: 0.8rem; padding-block: 6px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100% - 30px); }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 14px; }
.brand-mark { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 50% 50%, var(--surface) 0 4px, var(--accent) 5px 8px, var(--surface) 9px 10px, var(--accent) 11px); flex: none; }
.brand b { font-family: var(--font-head); font-size: 1.1rem; }
.rail a { display: flex; justify-content: space-between; gap: 8px; padding: 7px 10px; border-radius: var(--r); color: var(--ink-2); text-decoration: none; }
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.rail .group { margin: 12px 10px 4px; }
.count { font: 600 0.72rem/1.6 var(--font-mono); background: var(--crit); color: #fff; border-radius: 10px; padding: 0 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 10px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.who { display: flex; gap: 8px; align-items: center; min-width: 0; flex: 1 1 320px; }
.who select { max-width: 100%; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.clock { display: flex; gap: 6px; align-items: center; }
.clock .time { font: 600 1.1rem var(--font-mono); padding: 2px 8px; border-radius: var(--r); background: var(--surface-2); }
.content { padding: 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; max-width: 1400px; width: 100%; }
.head { display: flex; flex-direction: column; gap: 4px; }
.head p { max-width: 75ch; color: var(--ink-2); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.danger { border-color: var(--crit); color: var(--crit); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sm { padding: 3px 8px; font-size: 0.82rem; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.stat .v { font: 600 1.4rem var(--font-mono); font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 0.72rem var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
tr.sel td { background: var(--accent-soft); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; background: var(--info-soft); color: var(--info); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.plain { background: var(--surface-2); color: var(--ink-2); }
.sev { border-left: 4px solid var(--info); padding: 8px 10px; background: var(--surface-2); border-radius: 0 var(--r) var(--r) 0; display: flex; flex-direction: column; gap: 4px; }
.sev.red { border-color: var(--crit); background: var(--crit-soft); }
.sev.amber { border-color: var(--warn); background: var(--warn-soft); }
.sev.green { border-color: var(--ok); background: var(--ok-soft); }
.post { border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.post .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 0.78rem; color: var(--ink-3); }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--ink-2); }
textarea, input[type=text], select.f { width: 100%; border: 1px solid var(--line); border-radius: var(--r); padding: 8px; background: var(--surface); }
textarea { min-height: 96px; resize: vertical; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { display: grid; grid-template-columns: 58px 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 6px 0; border-bottom: 1px dashed var(--line); }
.tick { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); margin-top: 2px; }
.tick.done { background: var(--ok); border-color: var(--ok); }
.tick.next { border-color: var(--accent); }
.flow { display: flex; flex-wrap: wrap; gap: 4px; }
.flow span { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; background: var(--surface-2); color: var(--ink-3); }
.flow span.on { background: var(--ok-soft); color: var(--ok); font-weight: 600; }
.flow span.cur { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r); max-width: min(420px, calc(100% - 32px)); z-index: 20; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 48px; }
.bars i { flex: 1; background: var(--accent); opacity: 0.8; min-height: 1px; border-radius: 1px 1px 0 0; }
.bars i.future { background: var(--line); }
.map { width: 100%; max-width: 100%; height: auto; background: var(--surface-2); border-radius: var(--r); }
.map text { fill: var(--ink-2); font-size: 11px; font-family: var(--font-body); }
.map .land { fill: var(--surface); stroke: var(--line); }
.map .dot { fill: var(--crit); fill-opacity: 0.55; stroke: var(--crit); }
.map .base { fill: var(--ink-3); }
.empty { color: var(--ink-3); font-style: italic; }
details summary { cursor: pointer; color: var(--accent); }

@media (max-width: 960px) {
  .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px max(16px, env(safe-area-inset-left, 0px)); }
  .rail .group, .brand { display: none; }
  .rail a { flex: none; }
  .topbar { position: static; padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .content { padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .steps li { grid-template-columns: 46px 20px minmax(0, 1fr); }
  .steps li > :last-child { grid-column: 3; }
}
@media (prefers-reduced-motion: no-preference) { .toast { animation: rise 0.2s ease-out; } @keyframes rise { from { transform: translateY(8px); opacity: 0; } } }
td.mono, td.num { white-space: nowrap; }

/* ---------- charts, forecast, agent (v2) ---------- */
:root { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; } }
:root[data-theme="dark"] { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font-body); }
.chart .tick { fill: var(--ink-3); font-size: 11px; }
.chart .lbl { fill: var(--ink-2); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .now { stroke: var(--ink-3); stroke-dasharray: 3 3; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .pt circle:first-child { stroke: var(--surface); stroke-width: 2; }
.chart .hit { fill: transparent; stroke: none; }
.s1 { --c: var(--s1); } .s2 { --c: var(--s2); } .s3 { --c: var(--s3); } .s4 { --c: var(--s4); } .s5 { --c: var(--s5); }
.chart .ln { stroke: var(--c); } .chart .pt circle:first-child { fill: var(--c); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 4px 0 8px; font-size: 12.5px; color: var(--ink-2); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; }
.legend .sw { width: 14px; height: 4px; border-radius: 2px; background: var(--c); display: inline-block; }
.legend .sw.good { background: var(--ok); } .legend .sw.late { background: var(--warn); } .legend .sw.bad { background: var(--crit); }
.legend .mk { width: 10px; height: 10px; display: inline-block; }
.legend .mk.first { border-radius: 50%; background: var(--ink-2); }
.legend .mk.thr { background: var(--crit); transform: rotate(45deg) scale(.8); }
.legend .mk.truth { background: var(--ok); border-radius: 2px; }
.legend .mk.act { border-radius: 50%; background: var(--accent); }
.chart .track { stroke: var(--line); stroke-width: 1; }
.chart .seg { stroke-width: 4; stroke-linecap: round; }
.chart .seg.good { stroke: var(--ok); } .chart .seg.late { stroke: var(--warn); } .chart .seg.bad { stroke: var(--crit); }
.chart .m-first { fill: var(--ink-2); stroke: var(--surface); stroke-width: 2; }
.chart .m-thr { fill: var(--crit); stroke: var(--surface); stroke-width: 1.5; }
.chart .m-truth { fill: var(--ok); stroke: var(--surface); stroke-width: 1.5; }
.chart .m-act { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.fc { border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 8px 0; display: grid; gap: 6px; }
.fc.circulating { border-color: var(--crit); } .fc.ahead { border-color: var(--ok); }
.fcbar { width: 100%; height: 12px; display: block; }
.fcbar .track { fill: var(--surface-2); } .fcbar .win { fill: var(--warn); fill-opacity: .55; } .fcbar .nowm { fill: var(--ink); }
.thread { display: grid; gap: 10px; margin-top: 8px; }
.msg .ans p { margin: 4px 0; }
.cite { font: inherit; font-family: var(--font-mono); font-size: 11.5px; padding: 0 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--accent-soft); color: var(--accent); cursor: pointer; }
.chip { font: inherit; font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface-2); color: var(--ink-2); cursor: pointer; }
.kbrow { display: block; width: 100%; text-align: left; font: inherit; font-size: 13px; padding: 6px 8px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); cursor: pointer; }
.kbrow:hover, .kbrow.sel { background: var(--accent-soft); }
.btn.wrap { white-space: normal; text-align: left; height: auto; line-height: 1.3; padding-top: 5px; padding-bottom: 5px; }
.chip { white-space: normal; text-align: left; }
</style>

om Brightline: 'Harbourside suspect is recent arrival, sources say'","lang":"en","reach":21107,"shares":437,"flags":[],"synthetic":true},{"id":"P0077","narrative":"NAR-04","t":150,"platform":"facespace","account":"acct_346cd7","place":"castlewick","text":"Official: Northmoor Police curfew. Stay indoors after 6.","lang":"en","reach":19889,"shares":301,"flags":[],"synthetic":true},{"id":"P0090","narrative":"NAR-05","t":150,"platform":"facespace","account":"acct_ff2550","place":"port-ellery","text":"[THREAT] They'll get what's coming at 7. (synthetic threat text for referral testing)","lang":"en","reach":9497,"shares":321,"flags":["possible illegal content"],"synthetic":true},{"id":"P0118","narrative":"NAR-07","t":152,"platform":"vidstream","account":"acct_cf1d4e","place":"kingsbridge-centre","text":"Watch how gently they treat the other lot. Two-tier policing.","lang":"en","reach":4752,"shares":626,"flags":[],"synthetic":true},{"id":"P0054","narrative":"NAR-02","t":153,"platform":"chirp","account":"acct_843ae5","place":"port-ellery","text":"If it was one of us they'd have his face everywhere by now.","lang":"en","reach":15322,"shares":240,"flags":[],"synthetic":true},{"id":"P0091","narrative":"NAR-05","t":154,"platform":"facespace","account":"acct_0bf322","place":"port-ellery","text":"Harbourside hotel 7pm Saturday. Take back the harbour.","lang":"en","reach":7701,"shares":594,"flags":[],"synthetic":true},{"id":"P0092","narrative":"NAR-05","t":161,"platform":"groupcast","account":"acct_4f2836","place":"port-ellery","text":"Everyone down the hotel tonight, bring your mates.","lang":"en","reach":10030,"shares":629,"flags":[],"synthetic":true},{"id":"P0055","narrative":"NAR-02","t":162,"platform":"facespace","account":"acct_939de3","place":"port-ellery","text":"Police statement says nothing. What are they hiding?","lang":"en","reach":2437,"shares":486,"flags":[],"synthetic":true},{"id":"P0078","narrative":"NAR-04","t":162,"platform":"facespace","account":"acct_1c7a1e","p es"}],"lines":[{"id":"LN-001","title":"Misinformation during live investigations","status":"approved","expires":"2026-12-31","text":"We understand the public want answers quickly. We publish facts once they are confirmed. Please do not share speculation about people involved, which can harm victims and the course of justice.","cy":"Rydym yn deall bod y cyhoedd eisiau atebion yn gyflym. Rydym yn cyhoeddi ffeithiau unwaith y cânt eu cadarnhau. Peidiwch â rhannu dyfalu am bobl dan sylw.","checks":["Contempt","Impartiality"],"owner":"nc-head"},{"id":"LN-002","title":"Spoof police websites and notices","status":"approved","expires":"2027-03-31","text":"Only trust information on your force's official website and verified accounts. If you see a notice that claims to be from the police, check it on our website before sharing.","cy":"Ymddiriedwch yn unig mewn gwybodaeth ar wefan swyddogol eich heddlu a chyfrifon wedi'u dilysu.","checks":["Impartiality"],"owner":"nc-head"},{"id":"LN-003","title":"Protest policing is impartial","status":"approved","expires":"2026-12-31","text":"Police do not take sides. We facilitate lawful protest and act against crime whoever commits it.","cy":"Nid yw'r heddlu'n cymryd ochr. Rydym yn hwyluso protest gyfreithlon.","checks":["Impartiality","Pre-election"],"owner":"nc-head"},{"id":"LN-004","title":"AI-generated and recycled images","status":"expired","expires":"2026-10-31","text":"Old or fake images are being shared. Check the source before you share.","cy":"","checks":[],"owner":"nc-head"}],"scenarios":[{"id":"SC-01","title":"Golden Hour: Harbourside Market stabbing","goal":"Shrink time to truth on a false suspect identity, with every release legally checked and signed off.","actors":["nm-gold","nm-press","nm-sio","nm-legal","nc-insight","nc-duty","nc-head","ho-press","sv-comms","dg-comms","km-comms","eth"],"steps":[{"t":0,"actor":"nm-gold","view":"golden-hour","do":"Declare the critical incident and open the Golden Hour cell","check":"cellOpen:INC-NMP-0412"},{"t":10,"actor":"nm-press","view":"golden-hour","do":"Log the first facts: time, place, two injured, one man arrested","check":"factCount:INC-NMP-0412:2"},{"t":15,"actor":"nm-sio","view":"golden-hour","do":"Verify the facts in the fact log","check":"factsVerified:INC-NMP-0412:2"},{"t":20,"actor":"nm-press","view":"safe-to-say","do":"Draft a holding statement and run it through Safe to Say","check":"statementAtLeast:INC-NMP-0412:checked"},{"t":25,"actor":"nm-legal","view":"golden-hour","do":"Legal review of the holding statement","check":"statementAtLeast:INC-NMP-0412:legal"},{"t":28,"actor":"nm-sio","view":"golden-hour","do":"SIO approves the statement","check":"statementAtLeast:INC-NMP-0412:sio"},{"t":30,"actor":"nm-gold","view":"golden-hour","do":"Gold signs off; press officer publishes","check":"statementAtLeast:INC-NMP-0412:published"},{"t":60,"actor":"nc-insight","view":"radar","do":"Radar alert on NAR-01 (false identity). Triage it and link it to the incident","check":"narrativeLinked:NAR-01"},{"t":70,"actor":"nm-gold","view":"golden-hour","do":"Record a disclosure decision on nationality (interim ethnicity and nationality guidance)","check":"disclosureDecided:INC-NMP-0412"},{"t":75,"actor":"ho-press","view":"inbox","do":"Home Office responds to the request to confirm immigration status","check":"hoResponded:INC-NMP-0412"},{"t":90,"actor":"nc-duty","view":"lines","do":"Draft a national line on speculation about the suspect","check":"lineDrafted:SC-01"},{"t":95,"actor":"nc-head","view":"lines","do":"Approve and cascade the national line to all forces","check":"lineCascaded:SC-01"},{"t":100,"actor":"sv-comms","view":"lines","do":"Forces acknowledge the line (Severnvale, Dyfed-Glas with Welsh version, Kingsbridge)","check":"lineAcks:SC-01:3"},{"t":110,"actor":"eth","view":"audit","do":"Ethics panel reviews the decision trail: every decision has a named person and a reason","check":"auditViewed"}]},{"id":"SC-02","title":"Spoof curfew notice with state-linked indicators","goal":"Debunk a spoof notice fast, pass indicators to CTP and government, and never attribute publicly.","actors":["nc-insight","nm-press","ctp","gov-info","nc-head"],"steps":[{"t":90,"actor":"nc-insight","view":"radar","do":"Triage NAR-04 and hand state-linked indicators to CTP and government","check":"stateHandover:NAR-04"},{"t":95,"actor":"ctp","view":"inbox","do":"CTP liaison accepts the handover","check":"stateAccepted:NAR-04"},{"t":100,"actor":"nm-press","view":"safe-to-say","do":"Draft a rebuttal. Safe to Say blocks any public attribution to a state actor","check":"ruleFired:state-attribution"},{"t":105,"actor":"nm-press","view":"safe-to-say","do":"Publish the corrected rebuttal (no attribution, points to official channels as in LN-002)","check":"publishedMatch:no curfew"}]},{"id":"SC-03","title":"Mobilisation and threats: platform referral","goal":"Refer possible illegal content to the platform and CTIRU, and track response times as evidence.","actors":["nc-insight","nm-head","ctp","sib"],"steps":[{"t":100,"actor":"sib","view":"radar","do":"SIB analyst assesses community tension for Port Ellery from NAR-05","check":"tensionAssessed:port-ellery"},{"t":105,"actor":"nc-insight","view":"escalations","do":"Log a referral of the threatening post to the platform","check":"referralCount:1"},{"t":140,"actor":"nc-insight","view":"escalations","do":"Record the platform's response and time taken","check":"referralResolved:1"}]},{"id":"SC-04","title":"Two-tier narrative at a protest (lawful opinion)","goal":"Respond with facts about the policing plan without treating lawful opinion as a threat or profiling commentators.","actors":["km-comms","nc-insight","eth"],"steps":[{"t":30,"actor":"nc-insight","view":"radar","do":"Try to add the commentator account behind NAR-07 to a watchlist: Line of Blue refuses (Tier D)","check":"guardrailRefused:tier-d"},{"t":40,"actor":"km-comms","view":"safe-to-say","do":"Draft a policing plan explainer and pass the impartiality checks","check":"statementPublishedBy:km-comms"}]},{"id":"SC-05","title":"Bilingual flood hoax (civil emergency)","goal":"Counter a hoax in Welsh and English under the warning and informing duty.","actors":["dg-comms","nc-duty"],"steps":[{"t":35,"actor":"dg-comms","view":"safe-to-say","do":"Draft a bilingual rebuttal. Safe to Say flags a missing Welsh version until one is added","check":"statementPublishedBy:dg-comms"}]},{"id":"SC-06","title":"Youth trial and complainant anonymity (hard blocks)","goal":"Prove that drafts naming a child defendant or identifying a complainant cannot be released.","actors":["sv-comms","km-comms","cps"],"steps":[{"t":0,"actor":"sv-comms","view":"safe-to-say","do":"Draft about the Halden Street trial that names the defendant: hard block","check":"ruleFired:child-defendant"},{"t":0,"actor":"km-comms","view":"safe-to-say","do":"Draft that mentions Rivermead Close and the complainant's age: hard block","check":"ruleFired:complainant-anonymity"}]},{"id":"SC-07","title":"Get ahead: pre-bunk the spoof curfew before it appears","goal":"Use the rumour forecast and the L.O.B Agent to publish a signed-off pre-bunk before the first spoof notice is posted.","actors":["nm-gold","nm-head","nm-press","nm-legal","nm-sio","nc-insight"],"steps":[{"t":0,"actor":"nm-gold","view":"golden-hour","do":"Declare the critical incident. The rumour forecast appears in the cell","check":"cellOpen:INC-NMP-0412"},{"t":4,"actor":"nm-head","view":"agent","do":"Ask the L.O.B Agent for a get-ahead plan, with the guidance it rests on","check":"agentAsked:plan"},{"t":8,"actor":"nm-press","view":"golden-hour","do":"Send the spoof-notice pre-bunk from the forecast to Safe to Say and submit it","check":"prebunkAtLeast:NAR-04:checked"},{"t":12,"actor":"nm-legal","view":"golden-hour","do":"Legal review of the pre-bunk","check":"prebunkAtLeast:NAR-04:legal"},{"t":14,"actor":"nm-sio","view":"golden-hour","do":"SIO approves the pre-bunk","check":"prebunkAtLeast:NAR-04:sio"},{"t":16,"actor":"nm-gold","view":"golden-hour","do":"Gold signs off the pre-bunk","check":"prebunkAtLeast:NAR-04:gold"},{"t":18,"actor":"nm-press","view":"golden-hour","do":"Publish the pre-bunk","check":"prebunkAtLeast:NAR-04:published"},{"t":90,"actor":"nc-insight","view":"picture","do":"On the National picture, confirm the police line was out before the first spoof notice","check":"aheadOf:NAR-04"}]}],"knowledge":[{"id":"KB-CCA81","kind":"law","owner":"UK Parliament","title":"Contempt of Court Act 1981","url":"https://www.legislation.gov.uk/ukpga/1981/49","summary":"Strict liability rule (ss.1-2): a publication that creates a substantial risk of serious prejudice to active proceedings is contempt, whatever the intent. Proceedings are active from arrest or warrant. s.4(2) postponement orders and s.11 orders restrict reporting.","comms":"Once a suspect is arrested, avoid comment on guilt, motive, character or previous convictions. Stick to verified facts: what happened, where, when, and that a person is in custody."},{"id":"KB-LAWCOM","kind":"reform","owner":"Law Commission","title":"Contempt of court report, part 1 (18 Nov 2025)","summary":"Recommends proceedings become active at charge rather than arrest, and that a suspect's name, age, nationality, ethnicity, religion and immigration status would generally not create a substantial risk of prejudice. Government has not yet legislated; part 2 due 2026.","comms":"Not yet law. Line of Blue keeps the active-proceedings trigger configurable so the rules can change the day the law does."},{"id":"KB-SOAA92","kind":"law","owner":"UK Parliament","title":"Sexual Offences (Amendment) Act 1992","url":"https://www.legislation.gov.uk/ukpga/1992/34","summary":"Complainants of sexual offences have lifelong anonymity. Nothing likely to identify them may be published.","comms":"Hard block: no names, ages, streets, workplaces or other details that could identify a complainant, even in combination."},{"id":"KB-CYPA49","kind":"law","owner":"UK Parliament","title":"Children and Young Persons Act 1933 s.49 and YJCEA 1999 s.45","url":"https://www.legislation.gov.uk/ukpga/1999/23/section/45","summary":"Automatic reporting restrictions for children in youth court, and discretionary restrictions for under-18s in adult courts. The Southport defendant was 17.","comms":"Do not name or describe a child defendant or witness unless the court lifts restrictions."},{"id":"KB-APP","kind":"guidance","owner":"College of Policing","title":"Media and communications APP (replaces Media relations APP; consulted 5 Nov 2025 to 4 Jan 2026)","url":"https://www.college.police.uk/app","summary":"Six principles: open justice, privacy, legitimacy, accurate and lawful, timely and consistent, inclusive and impartial. Expects forces to tackle mis/disinformation that affects public safety or justice, and to keep better records. Suspects are not normally named before charge.","comms":"Fill the information void with verified facts quickly, record each disclosure decision and its reasons, and challenge false narratives that threaten safety or justice."},{"id":"KB-ETHNAT","kind":"guidance","owner":"College of Policing and NPCC (with CPS and Home Office)","title":"Interim guidance on suspect ethnicity and nationality (Aug 2025)","summary":"In high-profile cases where misinformation is causing tension, forces should consider confirming a suspect's ethnicity and nationality. Only the Home Office confirms immigration status. Decisions and reasons should be recorded.","comms":"When a false identity claim is spreading on a live case, put a disclosure decision to Gold quickly; request Home Office confirmation before saying anything about immigration status."},{"id":"KB-CHARTER","kind":"guidance","owner":"NPCC, College, CPS, Society of Editors, CRA, MLA","title":"Policing and Media Charter (17 Mar 2026)","summary":"Forces publish press office contact numbers, give direct updates to accredited media, and appoint a journalist safety liaison officer in every force.","comms":"Brief accredited media directly and early; they carry the verified line further and faster than police channels alone."},{"id":"KB-CPSPROT","kind":"guidance","owner":"CPS and NPCC","title":"CPS-police Media Protocol","summary":"Sets what prosecution material can be released and when, before and after charge and at trial.","comms":"Check the protocol before releasing images, footage or case detail after charge."},{"id":"KB-ART8","kind":"law","owner":"UK Parliament / courts","title":"Human Rights Act 1998 Art 8 and Sir Cliff Richard v BBC [2018]","url":"https://www.legislation.gov.uk/ukpga/1998/42","summary":"A suspect under investigation normally has a reasonable expectation of privacy. Interference must be lawful, necessary and proportionate.","comms":"Do not identify an uncharged suspect without a recorded, proportionate reason."},{"id":"KB-DEFAM","kind":"law","owner":"UK Parliament","title":"Defamation Act 2013","url":"https://www.legislation.gov.uk/ukpga/2013/26","summary":"Statements and reposts can be defamatory; repeating an allegation can carry liability.","comms":"Describe a false claim rather than reposting it or linking to its source."},{"id":"KB-PURDAH","kind":"guidance","owner":"Cabinet Office / Home Office","title":"Pre-election period guidance","summary":"During general, devolved, local, mayoral and PCC election periods, avoid any activity that could be seen as favouring a party or candidate. PCC elections end in May 2028.","comms":"In a pre-election period, talk about the policing plan and facts, never parties, candidates or politically loaded labels."},{"id":"KB-IMPART","kind":"guidance","owner":"College of Policing / Home Office","title":"Code of Ethics (2024), Standards of Professional Behaviour, Police Regulations 2003 Sch.1","summary":"Police must act with impartiality and must not take part in politics or appear partisan.","comms":"Answer 'two-tier policing' claims with facts about how both sides are policed; never mock or label either side."},{"id":"KB-EQUAL","kind":"law","owner":"UK Parliament","title":"Equality Act 2010 s.149 (public sector equality duty)","url":"https://www.legislation.gov.uk/ukpga/2010/15/section/149","summary":"Due regard to eliminating discrimination, advancing equality and fostering good relations.","comms":"Consider community impact of every line during tension; involve independent advisory groups early."},{"id":"KB-WELSH","kind":"law","owner":"Senedd","title":"Welsh Language (Wales) Measure 2011 and Welsh Language Standards","url":"https://www.legislation.gov.uk/mwa/2011/1","summary":"Welsh forces must communicate bilingually and treat Welsh no less favourably than English.","comms":"Publish Welsh and English together in Wales; a hoax in Welsh needs a rebuttal in Welsh."},{"id":"KB-CCA04","kind":"law","owner":"UK Parliament / Cabinet Office","title":"Civil Contingencies Act 2004 (warning and informing duty)","url":"https://www.legislation.gov.uk/ukpga/2004/36","summary":"Police are Category 1 responders with a legal duty to warn and inform the public in emergencies.","comms":"In a civil emergency, one joined-up public message with partners, repeated on every channel."},{"id":"KB-JESIP","kind":"doctrine","owner":"Emergency services (JESIP)","title":"JESIP joint doctrine","summary":"Shared multi-agency situational awareness and joint decision-making, including public messaging.","comms":"Agree the public line with fire, ambulance, council and NHS so the public hears one story."},{"id":"KB-RIPA","kind":"law","owner":"UK Parliament / Home Office","title":"RIPA 2000 Part II and Covert Surveillance Code of Practice (2018) paras 3.10-3.17","url":"https://www.legislation.gov.uk/ukpga/2000/23","summary":"Viewing public posts is usually fine. Systematically collecting and recording information about a particular person or group may be directed surveillance needing authorisation. Broad thematic research usually does not.","comms":"Monitor narratives and topics, not people. Any watchlist of individuals needs a recorded RIPA authorisation through intelligence channels."},{"id":"KB-DPA","kind":"law","owner":"UK Parliament / ICO","title":"UK GDPR and Data Protection Act 2018 Part 3 (as amended by the Data (Use and Access) Act 2025)","url":"https://www.legislation.gov.uk/ukpga/2018/12","summary":"Lawful basis, purpose limitation, minimisation, retention limits and a DPIA. Politics, religion and ethnicity are special category data.","comms":"Aggregate and pseudonymise by default; keep decision records, not scraped personal data."},{"id":"KB-HRA1011","kind":"law","owner":"UK Parliament","title":"Human Rights Act 1998 Art 10 and 11","url":"https://www.legislation.gov.uk/ukpga/1998/42","summary":"Expression, including views that offend, shock or disturb, and lawful assembly are protected.","comms":"Never treat lawful but unwelcome opinion as a threat. Respond with facts, not action against speakers."},{"id":"KB-OSA","kind":"law","owner":"UK Parliament / Ofcom","title":"Online Safety Act 2023","url":"https://www.legislation.gov.uk/ukpga/2023/50","summary":"Platform duties regulated by Ofcom; offences including false communications (s.179) and threatening communications (s.181).","comms":"Police are not the regulator. Refer illegal content to platforms or Ofcom and log the response time."},{"id":"KB-TACT","kind":"law","owner":"UK Parliament / Home Office","title":"Terrorism Act 2000 (proscription, ss.12-13) and CTIRU referrals","url":"https://www.legislation.gov.uk/ukpga/2000/11","summary":"Supporting or displaying support for a proscribed group is an offence. Terrorist content goes to CTIRU.","comms":"Route terrorist content to CTIRU, not to a comms response."},{"id":"KB-NSA","kind":"law","owner":"UK Parliament / Home Office","title":"National Security Act 2023 and Foreign Influence Registration Scheme (live 1 Jul 2025)","url":"https://www.legislation.gov.uk/ukpga/2023/32","summary":"Foreign interference is an offence and a national security matter. Attribution is decided by government, not by police communications.","comms":"Debunk the content, pass indicators to CTP and government, never name a state in public lines."},{"id":"KB-NCHI","kind":"policy","owner":"Home Office","title":"Government response on non-crime hate incidents (31 Mar 2026)","summary":"Non-crime hate incidents were scrapped; police should not record lawful speech against people.","comms":"Do not log lawful but offensive posts as incidents about the people who wrote them."},{"id":"KB-RESIST","kind":"toolkit","owner":"Government Communication Service","title":"RESIST counter-disinformation toolkit and evaluation framework","summary":"Government standard to Recognise, Early warning, Situational insight, Impact analysis, Strategic communication and Track disinformation. Endorses pre-bunking and measuring outcomes.","comms":"Pre-bunk likely falsehoods before they spread, choose the response by impact, and measure whether it worked."},{"id":"KB-HMIC24","kind":"inspection","owner":"HMICFRS","title":"Police response to the public disorder in July and August 2024 (Tranche 2)","summary":"Police 'have not kept pace' with online communications. 'Policing cannot be passive when public safety is at risk': forces must fill the information void and challenge false narratives. 1,804 arrests and 1,071 charged by 22 Jan 2025. Disorder mostly driven by disaffected individuals and online influencers, not one organised group.","comms":"Speed matters most. Narrative-first monitoring catches what watchlists miss."},{"id":"KB-NPCC25","kind":"strategy","owner":"NPCC","title":"Policing took action, now others must step up (May 2025)","summary":"NPCC is developing misinformation monitoring built on the social listening used in 2024, wants a proactive communications model, and is working more closely with the Cabinet Office. Police should not regulate social media.","comms":"The stated national requirement Line of Blue answers: a proactive, coordinated comms model."},{"id":"KB-WHITE26","kind":"strategy","owner":"Home Office","title":"From local to national: a new model for policing (Jan 2026)","summary":"A National Police Service absorbs NPCC coordination, the College and the Police Digital Service and provides 'a single national voice for communicating with the public'. Trust fell from 80% (2015/16) to 71% (2024/25). PCCs end in May 2028.","comms":"One national voice, consistent local delivery: national lines cascade, forces localise."},{"id":"KB-ISD24","kind":"research","owner":"Institute for Strategic Dialogue","title":"From rumours to riots (31 Jul 2024)","summary":"The false Southport name was published by a small site and amplified by large accounts within hours. No foreign state role was found.","comms":"False identity claims appear within the first hour of a critical incident; prepare for them at declaration."},{"id":"KB-SANCT24","kind":"policy","owner":"FCDO","title":"UK sanctions on Social Design Agency, Structura and ANO Dialog (28 Oct 2024)","summary":"Sanctioned for the Doppelganger network: at least 120 sites imitating real news and government pages, and attempts to incite protest in about six European countries.","comms":"Spoof official notices are a known tactic. Pre-bunk them: 'we only publish notices on our own website'."}],"playbooks":{"Critical incident":[{"pattern":"False suspect identity","narrative":"NAR-01","likelihood":0.9,"window":[10,60],"sources":["KB-ISD24","KB-ETHNAT"],"prebunk":"A man has been arrested. Please do not share names or claims about who he is: they are not from us, and they can harm victims and the case. We will publish facts as soon as they are confirmed.","action":"Put a nationality disclosure decision to Gold now; ask the Home Office to stand by on immigration status."},{"pattern":"Cover-up claims","narrative":"NAR-02","likelihood":0.8,"window":[30,90],"sources":["KB-APP","KB-HMIC24"],"prebunk":"We know people want to know more. We will update every hour, even when there is little new to say, and explain why some details cannot be shared yet.","action":"Commit to an hourly update rhythm and brief accredited media directly."},{"pattern":"Recycled or fake footage","narrative":"NAR-03","likelihood":0.7,"window":[40,120],"sources":["KB-RESIST"],"prebunk":"Old and unrelated videos are often shared after incidents like this. If you see footage claiming to be from Port Ellery today, check our channels before sharing it.","action":"Have the insight analyst reverse-search viral clips as they appear."},{"pattern":"Spoof official notices","narrative":"NAR-04","likelihood":0.55,"window":[60,150],"sources":["KB-SANCT24","KB-NSA"],"prebunk":"We only publish notices on our own website and verified accounts. If you see a police notice anywhere else, such as a curfew, check our website before you share it.","action":"Pre-approve national line LN-002 and alert CTP liaison to watch for spoof domains."},{"pattern":"Calls to gather","narrative":"NAR-05","likelihood":0.6,"window":[90,240],"sources":["KB-OSA","KB-HRA1011"],"prebunk":"Officers are in Port Ellery to keep everyone safe. Lawful protest is facilitated; violence and threats will be dealt with.","action":"SIB tension assessment for Port Ellery; prepare platform referral route for threats."}]}};</script>
<script>/* Line of Blue synthetic demo. Vanilla JS, no build step, no network calls.
   WORLD (synthetic data) is injected by scripts/build.py. All data is fictional. */
(function () {
  'use strict';
  const W = window.LINE_OF_BLUE_WORLD;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byId = (arr) => Object.fromEntries(arr.map((x) => [x.id, x]));
  const P = byId(W.personas), O = byId(W.orgs), N = byId(W.narratives), I = byId(W.incidents), PL = byId(W.places), PF = byId(W.platforms), SC = byId(W.scenarios), A = byId(W.actors), C = byId(W.cases);
  const STORE = 'lineofblue-demo-state-v1';
  const STAGES = ['draft', 'checked', 'legal', 'sio', 'gold', 'published'];
  const STAGE_LABEL = { draft: 'Draft', checked: 'Safe to Say checked', legal: 'Legal reviewed', sio: 'SIO approved', gold: 'Gold signed off', published: 'Published' };
  const VIEWS = [
    ['inbox', 'My work', 'Work'], ['picture', 'National picture', 'Listen'], ['radar', 'Narrative Radar', 'Listen'], ['agent', 'L.O.B Agent', 'Act'], ['golden-hour', 'Golden Hour cell', 'Act'], ['safe-to-say', 'Safe to Say', 'Act'],
    ['lines', 'National lines', 'Act'], ['escalations', 'Platform referrals', 'Act'], ['horizon', 'Event horizon', 'Plan'],
    ['scenarios', 'Scenarios', 'Demo'], ['audit', 'Decision log', 'Assure'], ['governance', 'Data and safeguards', 'Assure'],
  ];

  // ------------------------------------------------------------------ state
  const fresh = () => ({
    persona: 'nc-insight', clock: 0, threshold: 6, trigger: 'arrest', selNarr: 'NAR-01', selInc: 'INC-NMP-0412', scenario: 'SC-01',
    cells: {}, narr: {}, releases: [], lines: [], acks: {}, referrals: [], handovers: {}, tension: {}, fired: [], guardrails: [], auditViewed: false, audit: [], seq: 1, agent: { msgs: [], asked: [] }, agentQ: '', kbSel: null,
  });
  let S;
  try { S = Object.assign(fresh(), JSON.parse(localStorage.getItem(STORE) || 'null') || {}); } catch (e) { S = fresh(); }
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable: demo still works for this visit */ } };
  const me = () => P[S.persona];
  const can = (cap) => me().caps.includes(cap);
  const org = (p) => O[(p || me()).org];
  const nid = (pfx) => `${pfx}-${String(S.seq++).padStart(3, '0')}`;
  const clockStr = (m) => { const base = 13 * 60 + 50 + m; const h = Math.floor(((base % 1440) + 1440) % 1440 / 60), mm = (((base % 60) + 60) % 60); return `${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
  const log = (action, detail, extra = {}) => { S.audit.unshift({ id: nid('D'), t: S.clock, who: S.persona, org: me().org, action, detail, ...extra }); };
  const cell = (id) => (S.cells[id] = S.cells[id] || { open: false, facts: [], disclosure: null, ho: null });
  const narr = (id) => (S.narr[id] = S.narr[id] || { triaged: false, linked: false });
  const fire = (r) => { if (!S.fired.includes(r)) S.fired.push(r); };
  let toastMsg = '';
  const toast = (m) => { toastMsg = m; };

  // ------------------------------------------------------------------ derived data
  const livePosts = () => W.posts.filter((p) => p.t <= S.clock);
  function narrStats(n) {
    const ps = livePosts().filter((p) => p.narrative === n.id);
    const recent = ps.filter((p) => p.t > S.clock - 30);
    const first = W.posts.filter((p) => p.narrative === n.id).reduce((m, p) => Math.min(m, p.t), Infinity);
    const truth = truthAt(n, first);
    return {
      count: ps.length, velocity: recent.length, reach: ps.reduce((s, p) => s + p.reach, 0),
      platforms: [...new Set(ps.map((p) => PF[p.platform].name))], places: [...new Set(ps.map((p) => PL[p.place].name))],
      first: ps.length ? first : null, truth, ttt: ps.length && truth != null ? truth - first : null,
      alert: recent.length >= S.threshold || (n.risk === 'critical' && recent.length >= Math.ceil(S.threshold / 2)),
      flags: [...new Set(ps.flatMap((p) => p.flags))], posts: ps,
    };
  }
  function truthAt(n, first) {
    const times = [];
    S.releases.filter((r) => r.status === 'published' && (r.narratives || []).includes(n.id)).forEach((r) => times.push(r.publishedAt));
    S.lines.filter((l) => l.cascadedAt != null && l.narrative === n.id).forEach((l) => times.push(l.cascadedAt));
    return times.length ? Math.min(...times) : null; // a pre-bunk published before the first post counts: the line was ahead
  }
  const activeAlerts = () => W.narratives.filter((n) => { const s = narrStats(n); return s.alert && !narr(n.id).triaged; });

  // ------------------------------------------------------------------ Safe to Say rules engine
  // Configurable: proceedings become "active" at arrest (current law) or charge (Law Commission proposal, Nov 2025).
  function runChecks(text, cy, incId, orgId, opts = {}) {
    const out = [];
    const add = (id, level, title, why, fix) => out.push({ id, level, title, why, fix });
    const inc = incId ? I[incId] : null, cs = inc && inc.case, c = cell(incId || '_');
    const t = text || '';
    if (!t.trim()) return [{ id: 'empty', level: 'info', title: 'Nothing to check yet', why: 'Write or paste a draft.', fix: '' }];
    if (/lantern bureau|state[- ](backed|linked|sponsored)|foreign (state|government)|hostile state/i.test(t))
      add('state-attribution', 'red', 'Public attribution to a state actor', 'Attribution is a national security decision. Comms must not attribute publicly (National Security Act 2023 context).', 'Remove the attribution. Say the notice is fake and point to official channels (line LN-002). Indicators go to CTP and government through Narrative Radar.');
    const halden = C['CASE-SVC-3120'];
    if (/halden/i.test(t) && (/doyle|kieran/i.test(t) || /previous convictions|has form/i.test(t)))
      add('child-defendant', 'red', 'Identifies a child defendant or prejudices a youth trial', halden.note + ' Speculation about previous convictions risks contempt.', 'Do not name or describe the defendant. Refer to "a 16-year-old" only if already reported by the court.');
    const riv = C['CASE-KMP-0457'];
    if (/rivermead/i.test(t) && (riv.complainantDetails.some((d) => t.toLowerCase().includes(d.toLowerCase())) || /\b\d{1,2}-year-old woman|\baged \d+/i.test(t)))
      add('complainant-anonymity', 'red', 'Could identify a sexual offence complainant', riv.note, 'Remove street names, ages, workplaces and any detail that could identify the complainant.');
    if (cs) {
      const active = S.trigger === 'arrest' ? ['arrested', 'charged'].includes(cs.status) : cs.status === 'charged';
      const surname = cs.suspectName.split(' ')[1];
      if (new RegExp(surname, 'i').test(t))
        add('suspect-named', active ? 'red' : 'amber', 'Names a suspect who has not been charged', 'College of Policing guidance: suspects are not normally named before charge. Privacy expectation (Art 8; Richard v BBC).', 'Describe the person as "a 34-year-old man from Port Ellery".');
      if (active && /\b(guilty|the (killer|attacker) (is|was)|confess|motive|previous convictions|has form|terror(ist)? attack)\b/i.test(t))
        add('contempt', 'red', 'Contempt risk: proceedings are active', `Proceedings are active from ${S.trigger}. Comment on guilt, motive or character risks serious prejudice (Contempt of Court Act 1981).`, 'Stick to verified facts: what happened, where, when, and that a person is in custody.');
      if (!opts.prebunk && !c.facts.some((f) => f.verifiedBy)) add('no-verified-facts', 'amber', 'No verified facts in the incident log', 'Statements in a Golden Hour cell should rest on SIO-verified facts.', 'Ask the SIO to verify facts in the Golden Hour cell first.');
    }
    if (/asylum|immigration status|refugee|\bvisa\b|migrant|recent arrival/i.test(t)) {
      if (c.ho && c.ho.status === 'confirmed') add('immigration', 'amber', 'Immigration status: Home Office confirmation on record', 'Only the Home Office confirms immigration status. Confirmation recorded by ' + P[c.ho.by].name + '.', 'Quote the Home Office confirmation wording.');
      else add('immigration', 'red', 'Immigration status is for the Home Office to confirm', 'Interim ethnicity and nationality guidance (Aug 2025): police do not confirm immigration status.', 'Remove immigration claims, or request Home Office confirmation from the Golden Hour cell.');
    }
    if (/\b(british|nationality|ethnicity|white|black|asian|foreign national|born in|uk national)\b/i.test(t)) {
      if (c.disclosure) add('ethnicity', 'green', 'Nationality disclosure decision recorded', `Decided by ${P[c.disclosure.by].name}: ${c.disclosure.decision}.`, '');
      else add('ethnicity', 'amber', 'Ethnicity or nationality disclosure needs a recorded decision', 'Interim guidance: consider disclosure where misinformation is causing tension, and record the decision and reasons.', 'Gold records a disclosure decision in the Golden Hour cell.');
    }
    if (/https?:\/\/|\.info\b|\bRT @|sharing (this|from)|shared from/i.test(t))
      add('repost', 'amber', 'Links to or reposts third-party content', 'Reposting can repeat a falsehood or be defamatory (Defamation Act 2013).', 'Do not link the spoof or third-party source. Describe it instead.');
    const purdah = W.events.find((e) => e.purdah && e.force === orgId);
    if (/two-tier|labour|conservative|reform uk|lib dem|green party|candidate|mayor(al)?|vote/i.test(t) || purdah)
      if (/two-tier|labour|conservative|reform uk|lib dem|green party|candidate|mayor(al)?|vote/i.test(t))
        add('impartiality', 'amber', purdah ? 'Pre-election period: political content' : 'Political impartiality', (purdah ? purdah.title + '. ' : '') + 'Police must not appear partisan (Standards of Professional Behaviour; Code of Ethics).', 'Talk about the policing plan and facts, not about parties, candidates or the "two-tier" label itself.');
    if (O[orgId] && O[orgId].welsh && !(cy || '').trim())
      add('welsh', 'amber', 'Welsh version missing', 'Welsh Language Standards apply to Dyfed-Glas Police.', 'Add the Welsh text before release.');
    const long = t.split(/(?<=[.!?])\s+/).filter((s) => s.split(/\s+/).length > 30).length;
    if (long) add('plain-english', 'info', `${long} long sentence${long > 1 ? 's' : ''}`, 'Aim for under 25 words a sentence for public messages.', 'Split long sentences.');
    if (!out.some((r) => r.level === 'red' || r.level === 'amber')) add('clear', 'green', 'No legal or policy risks found', 'The human still decides. This check is advisory and recorded.', '');
    return out;
  }

  // ------------------------------------------------------------------ scenario checks
  function check(expr) {
    const [k, a, b, c2] = expr.split(':');
    const rel = (inc) => S.releases.filter((r) => r.incident === inc);
    switch (k) {
      case 'cellOpen': return cell(a).open;
      case 'factCount': return cell(a).facts.length >= +b;
      case 'factsVerified': return cell(a).facts.filter((f) => f.verifiedBy).length >= +b;
      case 'statementAtLeast': return rel(a).some((r) => STAGES.indexOf(r.status) >= STAGES.indexOf(b));
      case 'narrativeLinked': return narr(a).linked;
      case 'disclosureDecided': return !!cell(a).disclosure;
      case 'hoResponded': return !!(cell(a).ho && cell(a).ho.status !== 'requested');
      case 'lineDrafted': return S.lines.some((l) => l.scenario === a);
      case 'lineCascaded': return S.lines.some((l) => l.scenario === a && l.cascadedAt != null);
      case 'lineAcks': return S.lines.some((l) => l.scenario === a && (S.acks[l.id] || []).length >= +b);
      case 'auditViewed': return S.auditViewed;
      case 'stateHandover': return !!S.handovers[a];
      case 'stateAccepted': return S.handovers[a] && S.handovers[a].status === 'accepted';
      case 'ruleFired': return S.fired.includes(a);
      case 'tensionAssessed': return !!S.tension[a];
      case 'referralCount': return S.referrals.length >= +a;
      case 'referralResolved': return S.referrals.filter((r) => r.status === 'resolved').length >= +a;
      case 'guardrailRefused': return S.guardrails.includes(a);
      case 'publishedMatch': return S.releases.some((r) => r.status === 'published' && new RegExp(a, 'i').test(r.text));
      case 'agentAsked': return (S.agent.asked || []).includes(a);
      case 'prebunkAtLeast': return S.releases.some((r) => r.prebunk === a && STAGES.indexOf(r.status) >= STAGES.indexOf(b));
      case 'aheadOf': return aheadBy(a) != null;
      case 'statementPublishedBy': return S.releases.some((r) => r.author === a && r.status === 'published');
      default: return false;
    }
  }
  const myOpenSteps = () => W.scenarios.flatMap((sc) => sc.steps.map((st, i) => ({ sc, st, i }))).filter((x) => x.st.actor === S.persona && !check(x.st.check));

  // ------------------------------------------------------------------ small render helpers
  const pill = (txt, cls = '') => `<span class="pill ${cls}">${esc(txt)}</span>`;
  const riskPill = (r) => pill(r, { critical: 'crit', high: 'crit', medium: 'warn', low: 'ok' }[r] || '');
  const verdictPill = (v) => pill(v, { false: 'crit', misleading: 'warn', mobilisation: 'crit', opinion: 'plain', 'contempt risk': 'warn' }[v] || '');
  const btn = (label, action, args = {}, opts = {}) => {
    const cap = opts.cap; const ok = !cap || can(cap);
    const data = Object.entries(args).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ');
    return `<button class="btn ${opts.cls || ''} ${opts.sm ? 'sm' : ''}" data-action="${action}" ${data} ${opts.testid ? `data-testid="${opts.testid}"` : ''} ${ok && !opts.disabled ? '' : 'disabled'} title="${ok ? esc(opts.title || '') : 'Your role cannot do this (' + esc(cap) + ')'}">${esc(label)}</button>`;
  };
  const who = (id) => P[id] ? `${esc(P[id].name)} <span class="muted small">(${esc(O[P[id].org].short)})</span>` : esc(id);
  const head = (title, sub) => `<div class="head"><span class="eyebrow">${esc(org().name)} · synthetic</span><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ''}</div>`;
  function bars(nid) {
    const bins = [];
    for (let m = -60; m <= 180; m += 10) bins.push(m);
    const counts = bins.map((b) => W.posts.filter((p) => p.narrative === nid && p.t > b - 10 && p.t <= b).length);
    const max = Math.max(1, ...counts);
    return `<div class="bars" role="img" aria-label="Posts per 10 minutes, 12:50 to 16:50">${bins.map((b, i) => `<i class="${b > S.clock ? 'future' : ''}" style="height:${b > S.clock ? 2 : Math.round((counts[i] / max) * 100)}%"></i>`).join('')}</div><div class="row small muted" style="justify-content:space-between"><span>12:50</span><span>now ${clockStr(S.clock)}</span><span>16:50</span></div>`;
  }


  // ------------------------------------------------------------------ getting ahead: forecasts, first sightings, thresholds
  const KB = byId(W.knowledge || []);
  const firstCache = {};
  const firstEver = (nid) => (nid in firstCache ? firstCache[nid] : (firstCache[nid] = W.posts.filter((p) => p.narrative === nid).reduce((m, p) => Math.min(m, p.t), Infinity)));
  function thresholdAt(nid) {
    const ts = W.posts.filter((p) => p.narrative === nid && p.t <= S.clock).map((p) => p.t).sort((a, b) => a - b);
    for (const t of ts) if (ts.filter((x) => x > t - 30 && x <= t).length >= S.threshold) return t;
    return null;
  }
  const aheadBy = (nid) => { const t = truthAt(N[nid]); const f = firstEver(nid); return t != null && t < f ? f - t : null; };
  function forecasts(incId) {
    const inc = I[incId]; if (!inc || !inc.gold) return [];
    const c = cell(incId), base = c.open ? c.openedAt : 0;
    return ((W.playbooks || {})['Critical incident'] || []).filter((f) => N[f.narrative] && N[f.narrative].incident === incId).map((f) => {
      const s = narrStats(N[f.narrative]), pre = S.releases.find((r) => r.prebunk === f.narrative);
      const out = pre && pre.status === 'published';
      const state = out ? (pre.publishedAt < firstEver(f.narrative) ? 'ahead' : 'late') : s.count ? 'circulating' : 'expected';
      return { ...f, s, pre, state, from: base + f.window[0], to: base + f.window[1], base };
    });
  }
  const tttText = (s) => s.ttt == null ? null : s.ttt < 0 ? `police line ${-s.ttt} min ahead` : `time to truth ${s.ttt} min`;

  // ------------------------------------------------------------------ charts (hand-rolled SVG, palette tokens from styles.css)
  function velocityChart() {
    const top = W.narratives.map((n) => [n, narrStats(n)]).filter(([, s]) => s.count).sort((a, b) => b[1].count - a[1].count).slice(0, 5);
    if (!top.length) return '<p class="empty">No posts seen yet at this time.</p>';
    const lo = -60, hi = Math.max(60, Math.ceil(S.clock / 10) * 10), bins = [];
    for (let b = lo + 10; b <= hi; b += 10) if (b - 10 < S.clock) bins.push(b);
    const cnt = (nid, b) => W.posts.filter((p) => p.narrative === nid && p.t > b - 10 && p.t <= Math.min(b, S.clock)).length;

  function brief() {
    const al = W.narratives.map((n) => [n, narrStats(n)]).filter(([, s]) => s.count);

  V.radar = () => {
    const rows = W.narratives.map((n) => [n, narrStats(n)]).sort((a, b) => (b[1].alert - a[1].alert) || b[1].velocity - a[1].velocity);

      ${rows.map(([n, s]) => `<tr class="click ${n.id === sel.id ? 'sel' : ''}" data-action="selNarr" data-n="${n.id}" data-testid="narr-${n.id}"><td><span class="mono small">${n.id}</span> ${esc(n.title)}</td><td>${verdictPill(n.verdict)}</td><td class="num">${s.velocity}</td><td class="num">${s.reach.toLocaleString('en-GB')}</td><td>${s.count === 0 ? pill('not yet seen', 'plain') : s.alert && !narr(n.id).triaged ? pill('ALERT', 'crit') : narr(n.id).triaged ? pill('triaged', 'ok') : pill('watching', 'plain')}</td></tr>`).join('')}

      <div class="sev red"><span class="eyebrow">Claim</span><span>${esc(sel.claim)}</span></div>

      <div class="small"><b>${ss.count}</b> posts · reach <b>${ss.reach.toLocaleString('en-GB')}</b> · ${esc(ss.platforms.join(', ') || 'no platforms yet')} · ${esc(ss.places.join(', '))}${ss.ttt != null ? ` · <b>${tttText(ss)}</b>` : ''}</div>
      ${ss.flags.length ? `<div class="row">${ss.flags.map((f) => pill(f, 'warn')).join('')}</div>` : ''}
      ${sel.actor ? `<div class="sev amber"><b>Tier ${A[sel.actor].tier} indicators: ${esc(A[sel.actor].name)}</b><span class="small">${esc(A[sel.actor].allowed)}</span></div>` : ''}
      <div class="row">
        ${btn(ns.triaged ? 'Triaged' : 'Triage alert', 'triage', { n: sel.id }, { cap: 'radar:triage', cls: ns.triaged ? '' : 'primary', disabled: ns.triaged || !ss.count, testid: 'triage' })}
        ${sel.incident ? btn(ns.linked ? 'Linked to ' + sel.incident : 'Link to incident', 'linkNarr', { n: sel.id }, { cap: 'radar:triage', disabled: ns.linked || !ss.count, testid: 'link-incident' }) : ''}

  function map(vol) {

  V['golden-hour'] = () => {

      <div class="row">${btn('Declare critical incident and open cell', 'openCell', { inc: inc.id }, { cap: 'cell:open', cls: 'primary', testid: 'open-cell' })}</div><p class="small muted">Gold or the force Head of Communications opens the cell. Opening it notifies NPCC Comms and NPoCC.</p></section>`;

    return `${head('Golden Hour cell', `Open since ${clockStr(c.openedAt)} · ${esc(inc.title)}`)}${sel}

      <div class="stat"><span class="eyebrow">Proceedings</span><span class="v small" style="font-size:1rem">${inc.case ? esc(inc.case.status) : 'none'}</span><span class="small muted">active from ${S.trigger}</span></div>
      <div class="stat"><span class="eyebrow">Linked narratives</span><span class="v">${linked.length}</span></div>

    <div class="grid2"><div class="stack">
      <section class="panel"><header><h2>Fact log</h2><span class="small muted">only verified facts may be published</span></header>
        <div class="scroll"><table><thead><tr><th>Time</th><th>Fact</th><th>Logged by</th><th>Status</th></tr></thead><tbody>${factRows || '<tr><td colspan="4" class="empty">No facts logged yet.</td></tr>'}</tbody></table></div>
        <div class="row"><input type="text" id="factText" aria-label="New fact" placeholder="e.g. Two people were injured at Harbourside Market at about 13:50" style="flex:1 1 260px">${btn('Log fact', 'addFact', { inc: inc.id }, { cap: 'fact:add', testid: 'add-fact' })}</div>
        <div class="row small">${['Officers were called to Harbourside Market, Port Ellery, at 13:52.', 'Two people were injured; one is in a serious condition in hospital.', 'A 34-year-old man was arrested at the scene and is in custody.'].map((s) => `<button class="btn sm" data-action="quickFact" data-inc="${inc.id}" data-text="${esc(s)}" ${can('fact:add') ? '' : 'disabled'}>+ ${esc(s.slice(0, 34))}…</button>`).join('')}</div>
      </section>
      <section class="panel"><header><h2>Releases and sign-off</h2><a class="btn sm" href="#safe-to-say">Draft in Safe to Say</a></header>
        ${rels.length ? rels.map((r) => releaseCard(r)).join('') : '<p class="empty">No release drafted yet. The duty press officer drafts the holding statement in Safe to Say.</p>'}
      </section></div>
      <div class="stack">
      ${forecastPanel(inc.id)}
      <section class="panel"><header><h2>Disclosure decision</h2><span class="small muted">ethnicity and nationality guidance</span></header>
        ${linked.some((n) => n.id === 'NAR-01') ? '<div class="sev red"><b>Narrative Radar: false identity claim is spreading on this case.</b><span class="small">Guidance says consider confirming nationality where misinformation is causing tension. Record the decision and reasons.</span></div>' : '<p class="small muted">No identity narrative linked yet.</p>'}
        ${c.disclosure ? `<div class="sev green"><b>${esc(c.disclosure.decision)}</b><span class="small">${esc(c.disclosure.rationale)}</span><span class="small">${who(c.disclosure.by)} at ${clockStr(c.disclosure.t)}</span></div>` : `<label class="f">Reasons (recorded)<textarea id="discReason" placeholder="Why this decision is necessary and proportionate"></textarea></label><div class="row">${btn('Confirm nationality publicly', 'decide', { inc: inc.id, d: 'Confirm the suspect is a British national' }, { cap: 'disclosure:decide', cls: 'primary', testid: 'decide-confirm' })}${btn('Do not confirm yet', 'decide', { inc: inc.id, d: 'Do not confirm nationality at this stage' }, { cap: 'disclosure:decide' })}</div>`}
        ${inc.case && inc.case.immigrationClaim ? `<div class="row">${c.ho ? pill('Home Office: ' + c.ho.status, c.ho.status === 'confirmed' ? 'ok' : 'warn') : btn('Ask Home Office to confirm immigration status', 'hoRequest', { inc: inc.id }, { cap: 'cell:join', testid: 'ho-request' })}</div><p class="small muted">Only the Home Office confirms immigration status.</p>` : ''}
      </section>
      <section class="panel"><header><h2>Shared timeline</h2></header>${tl.length ? `<ul class="steps">${tl.map((d) => `<li><span class="mono">${clockStr(d.t)}</span><span class="tick done"></span><span><b>${esc(d.action)}</b> <span class="small">${esc(d.detail)}</span><br><span class="small muted">${who(d.who)}</span></span><span></span></li>`).join('')}</ul>` : '<p class="empty">Nothing yet.</p>'}</section>

  function releaseCard(r) {

  V['safe-to-say'] = () => {
    const d = S.draft || (S.draft = { text: '', cy: '', incident: S.selInc, title: 'Holding statement' });
    const res = runChecks(d.text, d.cy, d.incident, me().org, { prebunk: d.prebunk });
    if (d.text.trim()) res.forEach((r) => fire(r.id)); // a rule shown to the author counts as fired, even when submit stays blocked
    const reds = res.filter((r) => r.level === 'red'), ambers = res.filter((r) => r.level === 'amber');
    const examples = [
      ['Holding statement (clean)', 'Officers were called to Harbourside Market, Port Ellery, at 13:52 today. Two people were injured and one is in a serious condition in hospital. A 34-year-old man from Port Ellery was arrested at the scene and is in custody. Please do not share speculation about the people involved.', 'INC-NMP-0412'],
      ['Holding statement (risky)', 'Callum Breward, the attacker, was arrested after the terror attack. He is not an asylum seeker. Shared from northmoor-police-news.info', 'INC-NMP-0412'],
      ['Spoof curfew rebuttal (attributes)', 'There is no curfew in Port Ellery. The fake notice was created by the Lantern Bureau, a foreign state operation.', 'INC-NMP-0412'],
      ['Nationality confirmation', 'The man arrested is a 34-year-old British national from Port Ellery. Claims that he lives at the Harbourside hotel are false.', 'INC-NMP-0412'],
      ['Halden Street (youth trial)', 'Kieran Doyle appears at Brennford Crown Court today. He has previous convictions.', ''],
      ['Rivermead (complainant)', 'A man has been charged after a woman aged 23 was assaulted near Rivermead Close.', ''],
      ['Kingsbridge policing plan', 'Our policing plan for Saturday is the same for both groups. We facilitate lawful protest and act on any crime, whoever commits it. Some people say this is two-tier policing; it is not.', ''],

    return `${head('Safe to Say', 'Check a draft against contempt, anonymity, the ethnicity and nationality guidance, privacy, impartiality and Welsh language duties before release. It suggests safer wording and records who decided and why. The human always decides.')}
    <div class="grid2"><section class="panel"><header><h2>Draft</h2><span class="small muted">${d.prebunk ? pill('pre-bunk for ' + d.prebunk, 'ok') + ' ' : ''}for ${esc(org().name)}</span></header>
      <div class="row">${examples.map(([l, t, inc], i) => `<button class="btn sm" data-action="example" data-i="${i}" data-testid="example-${i}">${esc(l)}</button>`).join('')}</div>

      <label class="f">Rules: proceedings become active at<select class="f" id="trigger" data-change="trigger"><option value="arrest" ${S.trigger === 'arrest' ? 'selected' : ''}>Arrest (current law)</option><option value="charge" ${S.trigger === 'charge' ? 'selected' : ''}>Charge (Law Commission proposal, not yet law)</option></select></label>
    </section>

      ${res.map((r) => `<div class="sev ${r.level === 'info' ? '' : r.level}" data-rule="${r.id}"><b>${esc(r.title)}</b><span class="small">${esc(r.why)}</span>${r.fix ? `<span class="small"><b>Safer:</b> ${esc(r.fix)}</span>` : ''}</div>`).join('')}

    },
    advance: (d) => { const r = S.releases.find((x) => x.id === d.r); r.status = d.to; if (d.to === 'published') { r.publishedAt = S.clock; r.publishedBy = S.persona; } log(d.to === 'draft' ? 'Release returned to author' : 'Release: ' + STAGE_LABEL[d.to], `${r.id} ${r.title}`, { incident: r.incident }); if (d.to === 'published') toast(`${r.id} published at ${clockStr(S.clock)}. Time to truth updated on linked narratives.`); },
    draftLine: () => { const l = { id: nid('LN'), title: $('#lTitle').value, text: $('#lText').value, narrative: $('#lNarr').value, status: 'pending approval', by: S.persona, scenario: 'SC-01', checks: ['Contempt', 'Impartiality'] }; S.lines.unshift(l); log('National line drafted', `${l.id} ${l.title}`, { incident: N[l.narrative].incident }); toast('Submitted to the Head of NPCC Communications for approval.'); },
    approveLine: (d) => { const l = S.lines.find((x) => x.id === d.l); l.status = 'approved'; l.approvedBy = S.persona; l.cascadedAt = S.clock; l.expires = '2026-11-28'; log('National line approved and cascaded', `${l.id} sent to ${W.orgs.filter((o) => o.kind === 'force').length} forces`, { incident: N[l.narrative].incident }); toast('Cascaded to all forces with read receipts.'); },
    ackLine: (d) => { const l = S.lines.find((x) => x.id === d.l); if (d.cy) { l.cy = 'Rydym yn deall bod pobl eisiau atebion. Mae dyn yn y ddalfa. Peidiwch â rhannu honiadau heb eu cadarnhau.'; l.cyBy = S.persona; } (S.acks[l.id] = S.acks[l.id] || []).push(me().org); log('National line acknowledged', `${l.id} by ${org().name}${d.cy ? ' with Welsh version' : ''}`); },
    pickScenario: (d) => { S.scenario = d.s; },
    prebunk: (d) => { const f = forecasts(d.inc).find((x) => x.narrative === d.n); if (!f) return; S.draft = { title: 'Pre-bunk: ' + f.pattern.toLowerCase(), text: f.prebunk, cy: '', incident: d.inc, prebunk: f.narrative }; log('Pre-bunk drafted from the rumour forecast', `${f.narrative} ${f.pattern}`, { incident: d.inc }); toast('Pre-bunk loaded into Safe to Say. Check it and submit it for sign-off.'); location.hash = 'safe-to-say'; },
    askQuick: (d) => { runAgent(QUICK[+d.i][1]); },
    askAgent: () => { const el = $('#agentQ'), q = ((el && el.value) || S.agentQ || '').trim(); if (!q) { toast('Type a question first.'); return; } S.agentQ = ''; runAgent(q); },
    agentDraft: (d) => { const m = S.agent.msgs.find((x) => x.id === d.m); if (!m || !m.draft) return; S.draft = { title: m.draft.title, text: m.draft.text, cy: '', incident: m.draft.incident || '', prebunk: m.draft.narrative || null }; log('L.O.B Agent draft sent to Safe to Say', m.draft.title, { incident: m.draft.incident }); location.hash = 'safe-to-say'; },
    agentClear: () => { S.agent = { msgs: [], asked: S.agent.asked }; },
    kbOpen: (d) => { S.kbSel = d.k; if (current() !== 'agent') location.hash = 'agent'; },
    actAs: (d) => { S.persona = d.p; if (+d.t > S.clock) S.clock = +d.t; if (d.v === 'golden-hour') S.selInc = 'INC-NMP-0412'; location.hash = d.v === 'inbox' ? 'inbox' : d.v; },
    clock: (d) => { S.clock = Math.max(-60, Math.min(240, S.clock + +d.m)); },
    reset: () => { const keep = S.persona; S = fresh(); S.persona = keep; toast('Demo reset to 13:50.'); },
  };
  V['safe-to-say'].ex = [
    'Officers were called to Harbourside Market, Port Ellery, at 13:52 today. Two people were injured and one is in a serious condition in hospital. A 34-year-old man from Port Ellery was arrested at the scene and is in custody. Please do not share speculation about the people involved.',
    'Callum Breward, the attacker, was arrested after the terror attack. He is not an asylum seeker. Shared from northmoor-police-news.info',
    'There is no curfew in Port Ellery. The fake notice was created by the Lantern Bureau, a foreign state operation.',
    'The man arrested is a 34-year-old British national from Port Ellery. Claims that he lives at the Harbourside hotel are false.',
    'Kieran Doyle appears at Brennford Crown Court today in the Halden Street case. He has previous convictions.',
    'A man has been charged after a woman aged 23 was assaulted near Rivermead Close.',
    'Our policing plan for Saturday is the same for both groups. We facilitate lawful protest and act on any crime, whoever commits it. Some people call this two-tier policing; it is not.',
    'Llyn Teg dam is safe. Follow the official flood warning for the lower Teg valley and use the rest centre at Ysgol Aberteg if you need to leave home.',
  ];

  // ------------------------------------------------------------------ shell
  function current() { const h = (location.hash || '').replace('#', ''); return V[h] ? h : 'inbox'; }
  function render() {
    const v = current();
    const alerts = activeAlerts().length, work = myOpenSteps().length;
    let group = '';
    $('#rail').innerHTML = `<div class="brand"><span class="brand-mark" aria-hidden="true"></span><div><b>Line of Blue</b><div class="small muted">synthetic demo · <a href="https://lineofblue.co.uk" target="_blank" rel="noopener" style="display:inline;padding:0;color:var(--accent)">lineofblue.co.uk</a></div></div></div>` + VIEWS.map(([id, label, g]) => { const gh = g !== group ? `<span class="group eyebrow">${g}</span>` : ''; group = g; const badge = id === 'radar' && alerts ? `<span class="count">${alerts}</span>` : id === 'inbox' && work ? `<span class="count">${work}</span>` : ''; return `${gh}<a href="#${id}" ${id === v ? 'aria-current="page"' : ''}>${label}${badge}</a>`; }).join('');
    const groups = {}; W.personas.forEach((p) => { (groups[O[p.org].name] = groups[O[p.org].name] || []).push(p); });
    $('#who').innerHTML = `<label for="persona" class="eyebrow">Acting as</label><select id="persona" data-change="persona">${Object.entries(groups).map(([g, ps]) => `<optgroup label="${esc(g)}">${ps.map((p) => `<option value="${p.id}" ${p.id === S.persona ? 'selected' : ''}>${esc(p.name)} · ${esc(p.role)}</option>`).join('')}</optgroup>`).join('')}</select>`;
    $('#clock').innerHTML = `<span class="eyebrow">Scenario clock</span><span class="time" data-testid="clock">${clockStr(S.clock)}</span>${btn('+10 min', 'clock', { m: 10 }, { sm: true, testid: 'clock-10' })}${btn('+30 min', 'clock', { m: 30 }, { sm: true, testid: 'clock-30' })}`;
    $('#view').innerHTML = V[v]();
    const t = $('#toast'); t.hidden = !toastMsg; t.textContent = toastMsg; toastMsg = '';
    save();
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
    const fn = H[b.dataset.action]; if (!fn) return;
    fn({ ...b.dataset }); render();
  });
  document.addEventListener('change', (e) => {
    const k = e.target.dataset.change; if (!k) return;
    if (k === 'persona') S.persona = e.target.value;
    else if (k === 'threshold') S.threshold = +e.target.value;
    else if (k === 'trigger') { S.trigger = e.target.value; log('Rule setting changed', `Proceedings active from ${S.trigger}`); }
    else if (k === 'selInc') S.selInc = e.target.value;
    else if (k === 'dInc') S.draft.incident = e.target.value;
    render();
  });
  let tmr;
  document.addEventListener('input', (e) => {
    const k = e.target.dataset.input; if (!k) return;
    if (k === 'agentQ') { S.agentQ = e.target.value; return save(); }
    const map = { dTitle: 'title', dText: 'text', dCy: 'cy' }; S.draft[map[k]] = e.target.value;
    if (k === 'dTitle') return save();
    clearTimeout(tmr); tmr = setTimeout(() => { const pos = e.target.selectionStart, id = e.target.id; render(); const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (er) { /* ignore */ } } }, 350);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'agentQ') { e.preventDefault(); H.askAgent(); render(); } });
  window.addEventListener('hashchange', render);
  sampler().then(() => { if (current() === 'agent') render(); });
  render();
})();
</script>
