<title>Line of Blue splash options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Two single-stroke versions of the splash side by side (stacked): the current upright hand, and version 8,
   a Sacramento-style hand (slanted, small x-height, tall loops). Each is ONE path from the left edge to the right. */
:root { --ground: #000; --ink: #3d9bff; --label: #7a879a; color-scheme: dark; }
html, body { height: 100%; margin: 0; background: var(--ground); }
body { display: grid; grid-template-rows: 1fr 1fr; font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; }
section { position: relative; border-bottom: 1px solid #0d1117; min-height: 220px; }
svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
path { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.tag { position: absolute; left: 16px; top: 14px; color: var(--label); font-size: 11px; letter-spacing: .06em; }
.tag b { color: #a9b8cc; font-weight: 400; }
</style>
<section><span class="tag"><b>A</b> · current selection · upright, plain</span><svg id="a" role="img" aria-label="line of blue, upright hand"><path/></svg></section>
<section><span class="tag"><b>B</b> · version 8 · Sacramento-style, one flowing line</span><svg id="b" role="img" aria-label="line of blue, flowing hand"><path/></svg></section>
<script>
