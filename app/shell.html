<title>Line of Blue</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Condensed:wght@600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>/*STYLES*/</style>
<div class="banner" role="note"><b>Synthetic demo.</b> Every force, person, place, account, group and post here is fictional. Not real police data. <span class="mono">lineofblue.co.uk</span></div>
<div class="app">
  <nav class="rail" id="rail" aria-label="Workspaces"></nav>
  <div class="main">
    <div class="topbar"><div class="who" id="who"></div><div class="clock" id="clock"></div></div>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<div id="splash" role="dialog" aria-label="Line of Blue" hidden>
  <svg id="spSvg" aria-hidden="true"><path id="spPen"/></svg>
  <button id="spWords" type="button" aria-label="Enter Line of Blue"></button>
</div>
<style>
/* Splash (brand version A): black page, one blue continuous line that writes "line of blue". Click the words to enter. */
#splash { position: fixed; inset: 0; z-index: 1000; background: #000; transition: opacity .6s ease; color-scheme: dark; }
#splash.out { opacity: 0; pointer-events: none; }
#spSvg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#spPen { fill: none; stroke: #3d9bff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#spWords { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 6px; }
#spWords:focus-visible { outline: 1px solid #3d9bff; outline-offset: 6px; }
#splash:has(#spWords:hover) #spPen, #splash:has(#spWords:focus-visible) #spPen { stroke-width: 2.2; }
</style>
<script>
(function () {
  var sp = document.getElementById('splash');
  if (location.hash && location.hash.length > 1) { sp.remove(); return; }   // deep links go straight to the app
  sp.hidden = false;
  var WORD =
    // l
    "C4 -3, 7 -13, 7 -20 C7 -25, 2 -25, 2 -20 L2 -3 C2 0, 5 0.5, 8 -3 " +
    // i
    "C9 -5, 10 -9, 10 -12 L10 -2 C10 0.5, 13 0.5, 15 -2 " +
    // n
    "C15.5 -5, 16 -9, 16 -12 L16 0 L16 -7 C16 -11, 18 -12.5, 20 -12.5 C22 -12.5, 23 -11, 23 -8 L23 -2 C23 0.5, 26 0.5, 28 -2 " +
    // e
    "C31 -4, 34 -6, 34 -9 C34 -11.5, 32 -12.5, 30.5 -12.5 C28.5 -12.5, 27.5 -10, 27.5 -7 C27.5 -2.5, 29.5 0, 32 0 C34 0, 35 -1, 36 -2 " +
    // word gap along the line
    "C37 -0.5, 39 0, 41 0 L47 0 " +
    // o
    "C47.5 -6, 50 -12.5, 53 -12.5 C56 -12.5, 58 -9.5, 58 -6 C58 -2.5, 56 0, 53 0 C50 0, 48 -2.5, 48 -6 C48 -9.5, 50 -12.5, 53 -12.5 C55 -12.5, 57 -11.5, 60 -10.5 " +
    // f
    "C61.5 -13, 63.5 -18, 63.5 -22 C63.5 -26, 60 -26, 60 -22 L60 8 C60 12, 64 12, 64 8.5 C64 5, 61.5 1, 60 0 " +
    // word gap
    "C61.5 0.3, 65 0, 68 0 L74 0 " +
    // b
    "C78 -3, 81 -13, 81 -20 C81 -25, 76 -25, 76 -20 L76 0 L76 -7 C76 -11, 83.5 -13.5, 83.5 -6.5 C83.5 -2, 80.5 0, 78.5 0 C77.5 0, 76.8 -0.3, 76.3 -0.8 C79 0.3, 83 0.3, 86 -2 " +
    // l
    "C89 -5, 92 -14, 92 -20 C92 -25, 87 -25, 87 -20 L87 -3 C87 0, 90 0.5, 93 -2 " +
    // u
    "C94 -5, 94.5 -9, 94.5 -12 L94.5 -4 C94.5 -1, 96.5 0, 98.5 0 C100.5 0, 101.5 -1.5, 101.5 -4 L101.5 -12 L101.5 -2 C101.5 0.5, 104 0.5, 106 -2 " +
    // e, then back down onto the line
    "C109 -4, 112 -6, 112 -9 C112 -11.5, 110 -12.5, 108.5 -12.5 C106.5 -12.5, 105.5 -10, 105.5 -7 C105.5 -2.5, 107.5 0, 110 0 C112 0, 113 -1, 114 -2 C115 -0.5, 117 0, 119 0";
  var WIDTH = 119;
  var svg = document.getElementById('spSvg'), pen = document.getElementById('spPen'), btn = document.getElementById('spWords');
  var still = matchMedia('(prefers-reduced-motion: reduce)').matches, drawn = false;
  function layout() {
    var w = innerWidth, h = innerHeight, k = w < 600 ? 1.3 : 1.7;
    var ox = (w - WIDTH * k) / 2, oy = Math.round(h * 0.5) + 0.5;
    var d = 'M0 ' + oy + ' L' + ox.toFixed(2) + ' ' + oy + ' ' +
      WORD.replace(/(-?\d+(?:\.\d+)?) (-?\d+(?:\.\d+)?)/g, function (m, x, y) { return (ox + x * k).toFixed(2) + ' ' + (oy + y * k).toFixed(2); }) + ' L' + w + ' ' + oy;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); pen.setAttribute('d', d);
    // the click target covers the written words only, not the line running to the edges
    Object.assign(btn.style, { left: (ox - 6) + 'px', top: (oy - 26 * k - 6) + 'px', width: (WIDTH * k + 12) + 'px', height: (38 * k + 12) + 'px' });
    if (!drawn && !still && pen.animate) {
      var len = pen.getTotalLength(); pen.style.strokeDasharray = len;
      pen.animate([{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 4200, delay: 300, easing: 'cubic-bezier(.5,0,.5,1)', fill: 'both' })
        .finished.then(function () { pen.style.strokeDasharray = 'none'; });
    }
    drawn = true;
  }
  layout();
  addEventListener('resize', function () { if (sp.isConnected) { pen.style.strokeDasharray = 'none'; layout(); } });
  btn.addEventListener('click', function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 650); });
})();
</script>
<script>window.LINE_OF_BLUE_WORLD = /*WORLD*/;</script>
<script>/*APP*/</script>
